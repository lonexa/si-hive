<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(220, 70%, 60%)"/>
      <stop offset="100%" stop-color="hsl(220, 70%, 45%)"/>
    </linearGradient>
  </defs>
  <!-- Hexagon -->
  <polygon points="16,2 28.9,9 28.9,23 16,30 3.1,23 3.1,9" fill="url(#g)" stroke="hsl(220, 70%, 35%)" stroke-width="0.5"/>
  <!-- Inner honeycomb lines -->
  <line x1="16" y1="2" x2="16" y2="16" stroke="hsla(220, 70%, 80%, 0.3)" stroke-width="0.8"/>
  <line x1="28.9" y1="9" x2="16" y2="16" stroke="hsla(220, 70%, 80%, 0.3)" stroke-width="0.8"/>
  <line x1="28.9" y1="23" x2="16" y2="16" stroke="hsla(220, 70%, 80%, 0.3)" stroke-width="0.8"/>
  <line x1="16" y1="30" x2="16" y2="16" stroke="hsla(220, 70%, 80%, 0.3)" stroke-width="0.8"/>
  <line x1="3.1" y1="23" x2="16" y2="16" stroke="hsla(220, 70%, 80%, 0.3)" stroke-width="0.8"/>
  <line x1="3.1" y1="9" x2="16" y2="16" stroke="hsla(220, 70%, 80%, 0.3)" stroke-width="0.8"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2.5" fill="white" opacity="0.9"/>
</svg>
